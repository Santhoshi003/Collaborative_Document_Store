version: '3.9'

services:

  mongo:
    image: mongo:7

    ports:
      - "27018:27017"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .

    ports:
      - "5000:5000"

    depends_on:
      mongo:
        condition: service_healthy

    env_file:
      - .env

volumes:
  mongo_data: